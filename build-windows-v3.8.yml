name: Build Junba AI Transcriber v3.8.2 Slim Hybrid

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.spec'
      - '**.java'
      - '**.kt'
      - '**.kts'
      - 'requirements.txt'
      - 'hooks/**'
      - 'packaging/**'
      - 'android/**'
      - '.github/workflows/build-windows-v3.8.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: junba-v382-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: Validate Windows source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Source preflight
        shell: pwsh
        run: |
          foreach ($p in @('main.py','app','tests','hooks','packaging','JunbaAITranscriber_onefile.spec','JunbaAITranscriber_portable.spec')) {
            if (!(Test-Path $p)) { throw "Missing required source: $p" }
          }
          python -m compileall -q main.py app
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax preflight failed' }
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip check
          pytest -q tests
          $env:QT_QPA_PLATFORM = 'offscreen'
          python main.py --ui-self-test "$pwd/UI_OK.txt"
          if (-not (Select-String -Path "$pwd/UI_OK.txt" -Pattern 'UI_SELFTEST_OK' -Quiet)) { throw 'Source UI self-test failed' }

  portable:
    name: Build Portable x64
    needs: validate-windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build short-path Portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JunbaAITranscriber_portable.spec
          $exe = "$pwd/dist/JunbaP/Junba.exe"
          if (!(Test-Path $exe)) { throw 'Portable EXE not found' }
      - name: Portable self-tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path r | Out-Null
          $exe = "$pwd/dist/JunbaP/Junba.exe"
          foreach ($args in @(
            @('--windowed-io-self-test', "$pwd/r/io.txt"),
            @('--self-test', "$pwd/r/self.txt"),
            @('--ui-self-test', "$pwd/r/ui.txt")
          )) {
            $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Portable self-test failed: $($args[0])" }
          }
      - name: Path length report and package
        shell: pwsh
        run: |
          $base = (Resolve-Path "$pwd/dist/JunbaP").Path
          $items = Get-ChildItem "$base" -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($base.Length + 1)
            [PSCustomObject]@{ Length=$rel.Length; Path=$rel }
          } | Sort-Object Length -Descending
          $max = $items | Select-Object -First 1
          "Longest relative path: $($max.Length)" | Set-Content "$pwd/r/PATH_REPORT.txt" -Encoding UTF8
          $max.Path | Add-Content "$pwd/r/PATH_REPORT.txt" -Encoding UTF8
          if ($max.Length -gt 205) { throw "Portable relative path still too long: $($max.Length)" }
          Compress-Archive -Path "$pwd/dist/JunbaP/*" -DestinationPath "$pwd/r/JunbaP.zip" -Force
          "ZIP  $((Get-FileHash "$pwd/r/JunbaP.zip" -Algorithm SHA256).Hash)  JunbaP.zip" | Set-Content "$pwd/r/SHA256.txt" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-v382-Portable
          path: |
            r/JunbaP.zip
            r/SHA256.txt
            r/PATH_REPORT.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: r/JunbaP.zip

  single-exe:
    name: Build Single EXE x64
    needs: validate-windows
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build Single EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JunbaAITranscriber_onefile.spec
          if (!(Test-Path "$pwd/dist/Junba.exe")) { throw 'Single EXE not found' }
      - name: Single EXE self-tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path r | Out-Null
          $exe = "$pwd/dist/Junba.exe"
          foreach ($args in @(
            @('--windowed-io-self-test', "$pwd/r/io.txt"),
            @('--self-test', "$pwd/r/self.txt"),
            @('--ui-self-test', "$pwd/r/ui.txt")
          )) {
            $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Single self-test failed: $($args[0])" }
          }
          Copy-Item $exe "$pwd/r/Junba.exe" -Force
          "EXE  $((Get-FileHash "$pwd/r/Junba.exe" -Algorithm SHA256).Hash)  Junba.exe" | Set-Content "$pwd/r/SHA256.txt" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-v382-Single
          path: |
            r/Junba.exe
            r/SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: r/Junba.exe

  android-apk:
    name: Build Android Hybrid APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for p in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/android-cli && mkdir -p /tmp/android-cli
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
            mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Android hybrid preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          test -f android/app/src/main/java/tw/junba/transcriber/LocalWhisperEngine.kt
          test -f android/app/src/main/java/tw/junba/transcriber/SecureKeyStore.java
          grep -q 'whisper-android:1.0.0' android/app/build.gradle.kts
          grep -q 'aistudio.google.com/app/apikey' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'SecureKeyStore' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'setFixedLengthStreamingMode' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
      - name: Compile Android Java and Kotlin
        shell: bash
        run: gradle -p android :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --stacktrace
      - name: Build APK
        shell: bash
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Package APK
        shell: bash
        run: |
          mkdir -p r
          cp android/app/build/outputs/apk/debug/app-debug.apk r/Junba.apk
          sha256sum r/Junba.apk > r/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-v382-APK
          path: |
            r/Junba.apk
            r/SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: r/Junba.apk
